<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="omarchy-dida — 滴答清单：任务、习惯与专注，尽在 Omarchy 状态栏">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#363A4F"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24273A" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#24273A" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#24273A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A97F"/>
      <stop offset="0.45" stop-color="#8AADF4"/>
      <stop offset="1" stop-color="#8AADF4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="704" y="40" width="432" height="240" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="#24273A"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>
  <rect x="440" width="760" height="320" fill="url(#fade)"/>

  <!-- mark -->
  <g transform="translate(64,58)">
    <rect width="46" height="46" rx="12" fill="none" stroke="#F5A97F" stroke-width="2.5"/>
    <path d="M13 24 l8 8 l14 -17" fill="none" stroke="#F5A97F" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Noto Sans CJK SC, monospace">
    <text x="130" y="96" font-size="46" font-weight="700" fill="#CAD3F5" letter-spacing="-1.5">omarchy-dida</text>
    <rect x="64" y="122" width="360" height="2" rx="1" fill="url(#rule)"/>
    <text x="64" y="160" font-size="19" fill="#A5ADCB">滴答清单，常驻 Omarchy 状态栏。</text>
    <text x="64" y="188" font-size="19" fill="#A5ADCB">任务管理 · 习惯打卡 · 专注计时</text>

    <g font-size="13" fill="#8AADF4">
      <g transform="translate(64,214)">
        <rect width="122" height="28" rx="6" fill="none" stroke="#494D64"/>
        <text x="14" y="19">智能清单</text>
      </g>
      <g transform="translate(196,214)">
        <rect width="148" height="28" rx="6" fill="none" stroke="#494D64"/>
        <text x="14" y="19" fill="#A6DA95">离线任务同步</text>
      </g>
      <g transform="translate(354,214)">
        <rect width="126" height="28" rx="6" fill="none" stroke="#494D64"/>
        <text x="14" y="19" fill="#F5A97F">快捷添加</text>
      </g>
    </g>

    <!-- the bar strip it lives in -->
    <g transform="translate(64,266)">
      <rect width="416" height="30" rx="7" fill="#1E2030" stroke="#363A4F"/>
      <text x="16" y="20" font-size="13" fill="#6E738D">1 2 3 4</text>
      <text x="252" y="20" font-size="13" fill="#6E738D">14:32</text>
      <g transform="translate(322,7)">
        <rect x="-8" y="-4" width="70" height="24" rx="6" fill="#363A4F" opacity="0.55"/>
        <path d="M2 8 l4 4 l7 -9" fill="none" stroke="#F5A97F" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="12" font-size="13" fill="#CAD3F5">3</text>
        <text x="38" y="12" font-size="13" fill="#6E738D">今天</text>
      </g>
    </g>
  </g>

  <!-- Simplified Chinese task view; demo content, not a screenshot. -->
  <g clip-path="url(#card)" font-family="Noto Sans CJK SC, sans-serif">
    <rect x="704" y="40" width="432" height="240" fill="#1E2030"/>
    <path d="M832 52 V268" stroke="#494D64"/>
    <rect x="716" y="52" width="104" height="24" rx="4" fill="none" stroke="#494D64"/>
    <text x="728" y="69" font-size="11" fill="#A5ADCB">搜索</text>
    <rect x="716" y="84" width="104" height="24" rx="4" fill="#363A4F"/>
    <g font-size="11" fill="#CAD3F5">
      <text x="728" y="101">今天</text><text x="802" y="101">3</text>
      <text x="728" y="127">收集箱</text>
      <text x="728" y="153">最近 7 天</text>
      <text x="728" y="179">全部任务</text>
      <text x="728" y="205">已完成</text>
      <text x="728" y="231">工具</text>
      <text x="728" y="260">专注</text>
    </g>
    <text x="848" y="72" font-size="15" font-weight="600" fill="#CAD3F5">今天</text>
    <text x="1062" y="72" font-size="10" fill="#A5ADCB">按清单</text>
    <path d="M848 84 H1120" stroke="#494D64"/>
    <text x="848" y="108" font-size="10" fill="#A5ADCB">工作</text>
    <g fill="none" stroke="#A5ADCB" stroke-width="1.2">
      <rect x="850" y="121" width="11" height="11" rx="2"/>
      <rect x="850" y="163" width="11" height="11" rx="2"/>
      <rect x="850" y="220" width="11" height="11" rx="2"/>
    </g>
    <g font-size="12" fill="#CAD3F5">
      <text x="874" y="132">整理本周计划</text>
      <text x="874" y="174">完成项目报告</text>
      <text x="874" y="231">阅读 20 分钟</text>
    </g>
    <text x="874" y="148" font-size="10" fill="#F5A97F">逾期 · 昨天</text>
    <text x="874" y="190" font-size="10" fill="#A5ADCB">今天 18:00</text>
    <text x="848" y="211" font-size="10" fill="#A5ADCB">个人</text>
    <text x="848" y="263" font-size="11" fill="#A5ADCB">＋ 添加任务…</text>
  </g>
  <rect x="704" y="40" width="432" height="240" rx="14" fill="none" stroke="#494D64" stroke-width="1.5"/>
</svg>
